<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Flappy Verb - Pretérito</title>
<style>
  :root{
    --sky:#70c5ce; --ink:#1d1d1d; --cream:#fff7d6;
    --green:#f08a2f; --gold:#f5c542; --gold2:#ffe98a; --goldDark:#a96e05;
  }
  *{box-sizing:border-box}
  html,body{
    margin:0;width:100%;height:100%;overflow:hidden;background:#111;
    font-family:"Courier New",monospace;
  }
  #wrap{width:100%;height:100%;display:flex;align-items:center;justify-content:center;background:#111}
  canvas{
    width:min(100vw,160vh);height:min(62.5vw,100vh);
    image-rendering:pixelated;image-rendering:crisp-edges;
    border:4px solid #111;box-shadow:0 0 0 4px #fff2,0 20px 60px #0008;background:var(--sky);
  }

  #hudButtons{position:fixed;top:12px;right:12px;display:flex;gap:8px;z-index:5}
  .hudBtn{
    width:auto;min-width:46px;padding:8px 10px;border:3px solid #171717;background:#fff7d6;
    box-shadow:3px 3px 0 #0004;font:700 13px "Courier New",monospace;cursor:pointer;
  }
  .hudBtn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 #0004}

  #quizOverlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.44);padding:20px;z-index:10;
  }
  #quizCard{
    width:min(760px,92vw);background:var(--cream);border:5px solid var(--ink);
    box-shadow:8px 8px 0 #0005;padding:22px 24px 20px;text-align:center;position:relative;
  }
  #quizCard.gold{
    background:#fff0a8;border-color:#7b5300;
    box-shadow:0 0 0 5px #ffd64f,8px 8px 0 #0005;
  }
  #quizCard.gold::before{
    content:"★ JACKPOT ★";display:block;margin:-6px 0 7px;
    color:#9b6500;font-weight:900;font-size:18px;letter-spacing:2px;
  }
  #quizTitle{
    margin:0 0 8px;font-size:clamp(22px,3vw,38px);color:#d66516;
    text-transform:uppercase;letter-spacing:1px;
  }
  #quizCard.gold #quizTitle{color:#9b6500}
  #quizPrompt{
    margin:12px auto 18px;max-width:680px;font-size:clamp(19px,2.4vw,30px);
    line-height:1.35;color:#171717;font-weight:bold;
  }
  #verbHint{color:#555;font-size:clamp(15px,1.5vw,19px);margin-bottom:8px}
  #answerChoices{display:grid;gap:12px;width:min(520px,92%);margin:6px auto 0}
  .answerChoice{
    width:100%;padding:14px 18px;border:4px solid #222;background:#fff;
    font:900 clamp(20px,2.2vw,28px) "Courier New",monospace;cursor:pointer;
    box-shadow:4px 4px 0 #0003;text-align:left;transition:transform .08s,background .12s;
  }
  .answerChoice:hover:not(:disabled){background:#fff0df}
  .answerChoice:active:not(:disabled){transform:translate(2px,2px);box-shadow:2px 2px 0 #0003}
  .answerChoice.correct{background:#bdeeb5;border-color:#238124;color:#174f18}
  .answerChoice.wrong{background:#ffc2c2;border-color:#b51f1f;color:#7c1010}
  .answerChoice:disabled{cursor:default}
  .choiceNum{display:inline-block;min-width:36px;color:#d66516}
  #feedback{min-height:28px;margin-top:12px;font-size:18px;font-weight:bold}
  #attempts{margin-top:5px;color:#555;font-size:15px}
  .tiny{margin-top:13px;color:#666;font-size:13px}

  #celebrationLayer{
    position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:30;display:none;
  }
  #jackpotText{
    position:absolute;left:50%;top:23%;transform:translate(-50%,-50%) scale(.7);
    font:900 clamp(44px,8vw,92px) "Courier New",monospace;color:#ffd84d;
    -webkit-text-stroke:5px #714a00;text-shadow:7px 7px 0 #0005;
    opacity:0;white-space:nowrap;
  }
  #celebrationLayer.play #jackpotText{animation:jackpotPop 1.65s ease-out forwards}
  .coin{
    position:absolute;top:-70px;width:28px;height:28px;border-radius:50%;
    background:#ffd84d;border:4px solid #8f5d00;box-shadow:inset 5px 0 #fff2f2,inset -5px 0 #d69b11;
    animation:coinFall var(--dur) cubic-bezier(.22,.64,.55,1) var(--delay) forwards;
  }
  .coin::after{content:"$";position:absolute;inset:0;display:grid;place-items:center;font:900 14px Arial;color:#9a6500}
  @keyframes coinFall{
    0%{transform:translateY(-70px) rotate(0deg);opacity:0}
    8%{opacity:1}
    100%{transform:translateY(115vh) rotate(var(--rot));opacity:1}
  }
  @keyframes jackpotPop{
    0%{opacity:0;transform:translate(-50%,-50%) scale(.45)}
    18%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}
    35%{transform:translate(-50%,-50%) scale(1)}
    78%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    100%{opacity:0;transform:translate(-50%,-62%) scale(1.08)}
  }

  #menuOverlay,#customizeOverlay{
    position:fixed;inset:0;display:none;align-items:center;justify-content:center;
    background:rgba(0,0,0,.46);padding:20px;z-index:20;
  }
  .menuCard{
    width:min(700px,92vw);background:#fff7d6;border:5px solid #171717;
    box-shadow:8px 8px 0 #0005;padding:24px;text-align:center;
  }
  .menuTitle{margin:0 0 10px;color:#d66516;font-size:clamp(28px,4vw,46px)}
  .menuButtons{display:grid;gap:14px;margin-top:20px}
  .menuButtons button,.customBtn{
    font:900 19px "Courier New",monospace;padding:14px;border:4px solid #171717;
    background:#f3d53c;cursor:pointer;box-shadow:4px 4px 0 #0004;
  }
  .menuButtons button:active,.customBtn:active{transform:translate(2px,2px)}
  #customizeOverlay .menuCard{width:min(920px,95vw);max-height:90vh;overflow:auto;text-align:left}
  .customHeader{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .customHeader h2{margin:0;color:#d66516}
  .customGrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;margin-top:16px}
  .category{border:4px solid #171717;background:white;padding:12px}
  .category h3{margin:0 0 10px;font-size:18px}
  .options{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
  .option{
    position:relative;min-height:88px;border:3px solid #171717;background:#fff7d6;
    cursor:pointer;padding:8px;text-align:center;font:700 12px "Courier New",monospace;
  }
  .option.selected{outline:5px solid #f08a2f}
  .option.locked{background:#d7d7d7;color:#555;cursor:not-allowed}
  .option.locked .preview{filter:grayscale(1) brightness(.35)}
  .preview{height:42px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:900}
  .req{font-size:10px;color:#666;margin-top:4px}
  .customFooter{display:flex;justify-content:flex-end;margin-top:16px}
  .unlockToast{
    position:fixed;left:50%;top:120px;transform:translateX(-50%) scale(.7);
    z-index:40;background:#fff0a8;border:5px solid #7b5300;box-shadow:7px 7px 0 #0005;
    padding:14px 22px;text-align:center;opacity:0;pointer-events:none;
    font:900 18px "Courier New",monospace;color:#7b5300;
  }
  .unlockToast.show{animation:unlockPop 1.8s ease-out forwards}
  @keyframes unlockPop{
    0%{opacity:0;transform:translateX(-50%) scale(.55)}
    18%{opacity:1;transform:translateX(-50%) scale(1.12)}
    35%,78%{opacity:1;transform:translateX(-50%) scale(1)}
    100%{opacity:0;transform:translateX(-50%) translateY(-18px) scale(1.03)}
  }
  @media(max-width:760px){
    .customGrid{grid-template-columns:1fr}
    .options{grid-template-columns:repeat(2,minmax(0,1fr))}
  }

</style>
</head>
<body>
<div id="wrap"><canvas id="game" width="960" height="600" aria-label="Flappy Verb"></canvas></div>

</div>

</div>

<div id="unlockToast" class="unlockToast"></div>

<div id="celebrationLayer">

</div>

function difficultyForScore(s){
  const rawScore=Math.max(0,s);
  // Keep the established difficulty curve through 130. After that,
  // difficulty rises only slightly and approaches a soft ceiling.
  const score=rawScore<=130
    ? rawScore
    : 130+18*(1-Math.exp(-(rawScore-130)/55));
  const t=Math.min(score/100,1);
  const curve=t*t*(3-2*t);
  const over=Math.max(0,score-100);
  const overFactor=1-Math.exp(-over/60);

  return {
    speed:2.85+2.55*curve+0.45*overFactor,
    gap:205-78*curve-10*overFactor,
    gravity:0.36+0.09*curve+0.02*overFactor,
    flap:-6.75-0.30*curve-0.05*overFactor,
    verticalSpread:0.60+0.38*curve,
    hitInset:4.5-2.4*curve
  };
}

function tone(freq,start,dur,vol=.03,type="square",destination="sfx",endFreq=null){

  o.type=type;o.frequency.setValueAtTime(freq,start);
  if(endFreq)o.frequency.exponentialRampToValueAtTime(Math.max(20,endFreq),start+dur);
  g.gain.setValueAtTime(.0001,start);g.gain.exponentialRampToValueAtTime(vol,start+.007);
  g.gain.setValueAtTime(vol*.72,Math.max(start+.01,start+dur*.62));
  g.gain.exponentialRampToValueAtTime(.0001,start+dur);
  o.connect(g);g.connect(destination==="music"?musicBus:sfxBus);o.start(start);o.stop(start+dur+.02);
}

  for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
  const s=ac.createBufferSource(),g=ac.createGain(),f=ac.createBiquadFilter();
  f.type="highpass";f.frequency.value=highpass;s.buffer=b;
  g.gain.setValueAtTime(vol,start);g.gain.exponentialRampToValueAtTime(.0001,start+dur);

function playMusicStep(){

  const i=musicStep%melody.length,m=melody[i],phrase=Math.floor(i/8)%chords.length;

  if(i%2===1){
    const tones=chordTones[chords[phrase]],h=tones[(Math.floor(i/2)+phrase)%3];

  if(i%2===0){
    const pattern=[1,1.5,2,1.5];
    tone(roots[phrase]*pattern[(i/2)%4|0],start,sec*1.4,.0115,"square","music");
  }
  if(i%8===0||i%8===4)tone(95,start,.055,.008,"square","music",48);

function goldChance(){

  return Math.min(.01+Math.floor(totalPassed/7)*.01,.07);
}
function shouldBeGold(){
  return Math.random()<goldChance();
}
function shuffledCopy(pool){
  const a=[...pool];
  for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}
  return a;
}
function refillQuestionDeck(gold=false){
  const pool=gold?irregularQuestions:questions;
  let deck=shuffledCopy(pool);
  const lastId=gold?lastHardQuestionId:lastMainQuestionId;
  if(deck.length>1&&deck[0].id===lastId){[deck[0],deck[1]]=[deck[1],deck[0]]}
  if(gold)hardQuestionDeck=deck;else questionDeck=deck;
}
function chooseQuestion(gold=false){
  if(gold){
    if(!hardQuestionDeck.length)refillQuestionDeck(true);
    const q=hardQuestionDeck.shift();lastHardQuestionId=q.id;return q;
  }
  if(!questionDeck.length)refillQuestionDeck(false);
  const q=questionDeck.shift();lastMainQuestionId=q.id;return q;
}

function addPipe(x,prev=null){
  const d=difficultyForScore(score),gap=d.gap,safeTop=58,safeBottom=H-GROUND_H-gap-58;
  const center=(safeTop+safeBottom)/2,fullRange=(safeBottom-safeTop)*d.verticalSpread;
  let target=center+(Math.random()-.5)*fullRange;
  if(prev){
    const maxStep=78+42*Math.min(score/100,1);
    target=Math.max(prev.topH-maxStep,Math.min(prev.topH+maxStep,target));
  }
  const topH=Math.max(safeTop,Math.min(safeBottom,Math.round(target)));
  const gold=!jackpotActive&&shouldBeGold();
  totalGenerated++;
  let isVerb=false;
  if(!gold){
    normalGenerated++;
    isVerb=normalGenerated%3===0;
  }
  const question=gold?chooseQuestion(true):(isVerb?chooseQuestion(false):null);
  const pipe={x,topH,passed:false,gold,isVerb,question,announced:false,lastSparkle:0};
  pipes.push(pipe);
  maybeSpawnHeart(prev,pipe);
}
function heartOverlapsPipeAt(x,y,r=17){
  const box={x:x-r,y:y-r,w:r*2,h:r*2};
  const gap=difficultyForScore(score).gap;
  for(const p of pipes){
    const top={x:p.x-10,y:0,w:pipeWidth+20,h:p.topH};
    const bottomY=p.topH+gap;
    const bottom={x:p.x-10,y:bottomY,w:pipeWidth+20,h:H-GROUND_H-bottomY};
    if(rectsOverlap(box,top)||rectsOverlap(box,bottom))return true;
  }

function maybeSpawnHeart(prev,newPipe){
  // 1% chance per newly generated pipe, only when a heart can actually help.
  if(jackpotActive||lives>=maxLives||heartPickups.length>0||!prev||Math.random()>=.01)return;

  // Place the heart in the open horizontal lane BETWEEN two pipe columns.
  // This keeps the pickup completely off the pipe bodies.
  const left=prev.x+pipeWidth+34;
  const right=newPipe.x-34;
  if(right-left<70)return;

  const x=left+(right-left)*(.35+Math.random()*.30);
  const gap=difficultyForScore(score).gap;
  const prevCenter=prev.topH+gap/2;
  const newCenter=newPipe.topH+gap/2;
  const center=(prevCenter+newCenter)/2;
  let y=Math.max(70,Math.min(H-GROUND_H-55,center+(Math.random()-.5)*70));

  for(let i=0;i<8&&heartOverlapsPipeAt(x,y);i++){
    y=70+Math.random()*(H-GROUND_H-140);
  }
  if(heartOverlapsPipeAt(x,y))return;

  heartPickups.push({x,y,r:16,collected:false,phase:Math.random()*Math.PI*2});
}

function addCoin(x,y){
  jackpotCoins.push({x,y,value:1,r:12,collected:false,phase:Math.random()*Math.PI*2});

function coinTrailOpenSlot(count,spacing){
  const needed=(count-1)*spacing+34;
  const sorted=[...pipes].sort((a,b)=>a.x-b.x);
  const intervals=[];
  for(let i=0;i<sorted.length-1;i++){
    const left=sorted[i].x+pipeWidth+24;
    const right=sorted[i+1].x-24;
    if(right-left>=needed && right>W+20)intervals.push({left,right,a:sorted[i],b:sorted[i+1]});
  }
  if(!intervals.length)return null;
  intervals.sort((a,b)=>Math.abs(a.left-(W+30))-Math.abs(b.left-(W+30)));
  const slot=intervals[0];
  const minX=slot.left+17;
  const maxStart=slot.right-17-(count-1)*spacing;
  if(maxStart<minX)return null;
  const startX=minX+Math.random()*(maxStart-minX);
  return {startX,a:slot.a,b:slot.b};
}
function spawnCoinTrail(requestedCount){
  if(jackpotCoinsSpawned>=jackpotCoinTarget)return;
  const remaining=jackpotCoinTarget-jackpotCoinsSpawned;
  const count=Math.min(remaining,Math.max(1,requestedCount||3));
  const spacing=50+Math.random()*8;
  const slot=coinTrailOpenSlot(count,spacing);
  if(!slot)return;

  const gap=difficultyForScore(score).gap;
  const centerA=slot.a.topH+gap/2;
  const centerB=slot.b.topH+gap/2;
  const baseY=Math.max(80,Math.min(H-GROUND_H-65,(centerA+centerB)/2));
  const amplitude=18+Math.random()*12;
  const phase=Math.random()*Math.PI*2;

  for(let i=0;i<count;i++){
    const x=slot.startX+i*spacing;
    const y=Math.max(65,Math.min(H-GROUND_H-48,baseY+Math.sin(phase+i*.9)*amplitude));
    addCoin(x,y);
    jackpotCoinsSpawned++;
  }
}
function prepareJackpotCoinWaves(){
  // Five evenly spaced waves keep coins present from start to finish.
  // Each wave now forms a slightly longer 3-4 coin path.
  // Spawn the final wave early enough to physically reach the bird before the 10-second timer ends.
  jackpotCoinWaveTimes=[0,1500,3000,4500,6000];
  const base=Math.floor(jackpotCoinTarget/jackpotCoinWaveTimes.length);
  const extra=jackpotCoinTarget%jackpotCoinWaveTimes.length;
  jackpotCoinWaveSizes=new Array(jackpotCoinWaveTimes.length).fill(base);

  // Randomize which waves receive the extra coin while keeping every wave at 3-4 coins.
  const order=[0,1,2,3,4].sort(()=>Math.random()-.5);
  for(let i=0;i<extra;i++)jackpotCoinWaveSizes[order[i]]++;
  jackpotCoinWaveIndex=0;
}
function startJackpot(){
  const now=performance.now();
  jackpotActive=true;jackpotStartMs=now;jackpotGraceUntil=0;
  jackpotCoins=[];
  jackpotCoinTarget=15+Math.floor(Math.random()*6); // exactly 15-20 coins total
  jackpotCoinsSpawned=0;
  prepareJackpotCoinWaves();
  spawnCoinTrail(jackpotCoinWaveSizes[0]);
  jackpotCoinWaveIndex=1;
  showJackpotCelebration();sfxJackpot();
  restoreMusic();
}
function jackpotElapsed(now){return jackpotActive?now-jackpotStartMs:0}
function jackpotRemaining(now){return Math.max(0,jackpotDurationMs-jackpotElapsed(now))}
function jackpotSpeedFactor(now){
  if(!jackpotActive)return 1;
  const remaining=jackpotRemaining(now);
  // Moderate 1.4x bonus. During final 3 seconds, smoothly return to 1.0x.
  if(remaining>3000)return 1.4;
  const t=remaining/3000;
  const eased=t*t*(3-2*t);
  return 1+0.4*eased;
}
function endJackpot(now){
  if(!jackpotActive)return;
  jackpotActive=false;
  jackpotGraceUntil=now+jackpotGraceMs;
  jackpotCoins=[];
  syncPhysicalDifficultyToScore();
}
function isCollisionProtected(now){
  return jackpotActive || now<jackpotGraceUntil || now<lifeGraceUntil;
}
function updateCoins(dt,now,speed){
  if(!jackpotActive)return;
  const f=Math.min(dt/16.6667,2);

  for(const c of jackpotCoins)c.x-=speed*f;
  jackpotCoins=jackpotCoins.filter(c=>!c.collected&&c.x>-60);

  // Time-based spawning keeps the 15-20 coins distributed across all 10 seconds.
  // Waves arrive at roughly 0, 1.5, 3, 4.5, and 6 seconds so the last coins remain collectible.
  const elapsed=jackpotElapsed(now);
  while(jackpotCoinWaveIndex<jackpotCoinWaveTimes.length && elapsed>=jackpotCoinWaveTimes[jackpotCoinWaveIndex]){
    spawnCoinTrail(jackpotCoinWaveSizes[jackpotCoinWaveIndex]);
    jackpotCoinWaveIndex++;
  }

  // Moderate magnet: helpful for near-misses, but still requires following the trail.
  const bx=bird.x+bird.w/2,by=bird.y+bird.h/2;
  for(const c of jackpotCoins){
    const dx=bx-c.x,dy=by-c.y,dist=Math.hypot(dx,dy);
    if(dist<96 && dist>1){
      const pull=(96-dist)/96;
      c.x+=dx*.075*pull*f;
      c.y+=dy*.075*pull*f;
    }
    if(Math.hypot(bx-c.x,by-c.y)<c.r+19){
      c.collected=true;
      score+=1;
      syncPhysicalDifficultyToScore();
      sfxCoin(1);
      if(score>best){best=score;saveBest()}
      checkUnlocks();
    }
  }
  jackpotCoins=jackpotCoins.filter(c=>!c.collected);
}

function update(dt,now){
  const f=Math.min(dt/16.6667,2);
  if(state==="ready"){
    bird.y=255+Math.sin(performance.now()/260)*8;
    cloudOffset=(cloudOffset+.12*f)%W;groundOffset=(groundOffset+1*f)%48;return;
  }
  if(state!=="playing")return;

  if(jackpotActive && jackpotElapsed(now)>=jackpotDurationMs)endJackpot(now);

  const d=difficultyForScore(score);
  physicalScore=score;
  const speed=d.speed*jackpotSpeedFactor(now);

  bird.vy+=d.gravity*f;bird.y+=bird.vy*f;
  groundOffset=(groundOffset+speed*f)%48;cloudOffset=(cloudOffset+.12*f)%W;

  // Full screen wrap only during the 10-second jackpot.
  if(jackpotActive){
    if(bird.y>H+bird.h){
      bird.y=-bird.h+2;lastJackpotWrapMs=now;
    }else if(bird.y+bird.h<0){
      bird.y=H-2;lastJackpotWrapMs=now;
    }
  }

  for(const p of pipes){
    p.x-=speed*f;

    if(p.gold&&p.x<W-20&&!p.announced){
      p.announced=true;p.lastSparkle=now;sfxGoldApproach();
    }
    if(p.gold&&p.announced&&!p.passed&&p.x<W&&p.x+pipeWidth>0&&now-p.lastSparkle>1550){
      p.lastSparkle=now;sfxGoldApproach();
    }

    if(!p.passed&&p.x+pipeWidth<bird.x){
      p.passed=true;totalPassed++;
      if(jackpotActive){
        // Bonus mode: every pipe is an automatic +1 and never interrupts play.
        score+=1;syncPhysicalDifficultyToScore();sfxPass();
        if(score>best){best=score;saveBest()}checkUnlocks()
      }else if(p.gold||p.isVerb){
        // Gold pipes always quiz. Every third non-gold pipe is a verb pipe.
        openQuiz(p);return;
      }else{
        // Ordinary pipes keep the flight flowing and are worth +1.
        score+=1;syncPhysicalDifficultyToScore();sfxPass();
        if(score>best){best=score;saveBest()}
        checkUnlocks();
      }
    }

    if(collisionWithPipe(p)){
      if(isCollisionProtected(now)){
        if(now-jackpotImpactFlash>120)jackpotImpactFlash=now;
      }else{
        loseHeart();return;
      }
    }
  }

  // Ceiling/ground are lethal normally. During grace, pipe collision is protected
  // but screen wrapping has ended, so keep the bird safely inside the playfield.
  if(!jackpotActive){
    if(now<jackpotGraceUntil||now<lifeGraceUntil){
      if(bird.y<0){bird.y=0;bird.vy=Math.max(0,bird.vy)}
      if(bird.y+bird.h>H-GROUND_H){bird.y=H-GROUND_H-bird.h;bird.vy=Math.min(0,bird.vy)}
    }else if(bird.y<-8||bird.y+bird.h>H-GROUND_H){
      loseHeart();return;
    }
  }

  updateCoins(dt,now,speed);
  updateHearts(dt,speed);

  if(pipes.length&&pipes[0].x+pipeWidth<-30){
    pipes.shift();
    const last=pipes[pipes.length-1];
    addPipe(last.x+pipeSpacing,last);
  }
}

  if(p.gold){
    drawGoldBody(bodyX,0,bodyW,p.topH-capH);drawGoldCap(x,p.topH-capH,pipeWidth,capH);
    const bottomY=p.topH+gap;drawGoldCap(x,bottomY,pipeWidth,capH);drawGoldBody(bodyX,bottomY+capH,bodyW,H-GROUND_H-(bottomY+capH));
    drawGoldSparkles(p,gap);
  }else{
    drawNormalBody(bodyX,0,bodyW,p.topH-capH);drawNormalCap(x,p.topH-capH,pipeWidth,capH);
    const bottomY=p.topH+gap;drawNormalCap(x,bottomY,pipeWidth,capH);drawNormalBody(bodyX,bottomY+capH,bodyW,H-GROUND_H-(bottomY+capH));
  }
  if(p.gold||p.isVerb)drawVerbLabel(p,gap);
}
function rainbowColor(offset=0){
  const hue=((performance.now()/7)+offset)%360;
  return `hsl(${hue} 95% 58%)`;
}
function drawCoins(){
  if(!jackpotActive)return;
  for(const c of jackpotCoins){
    const pulse=1+.10*Math.sin(performance.now()/110+c.phase);
    const r=c.r*pulse;
    ctx.save();ctx.translate(c.x,c.y);
    ctx.fillStyle="#f5bd2d";ctx.strokeStyle="#8c5b00";ctx.lineWidth=4;
    ctx.beginPath();ctx.arc(0,0,r,0,Math.PI*2);ctx.fill();ctx.stroke();
    ctx.fillStyle="#8c5b00";ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font='900 14px Arial';ctx.fillText("1",0,1);
    ctx.restore();
  }
}
function drawJackpotCountdown(){
  if(!jackpotActive)return;
  const remaining=jackpotRemaining(performance.now());
  if(remaining>3000||remaining<=0)return;
  const n=Math.max(1,Math.ceil(remaining/1000));
  const within=remaining%1000;
  const pop=1+0.18*Math.max(0,(within-720)/280);
  ctx.save();ctx.translate(W/2,120);ctx.scale(pop,pop);
  ctx.textAlign="center";ctx.textBaseline="middle";
  ctx.font='900 58px "Courier New",monospace';ctx.lineWidth=8;ctx.strokeStyle="#5e4100";
  ctx.strokeText(String(n),0,0);ctx.fillStyle="#ffe56a";ctx.fillText(String(n),0,0);
  ctx.restore();
}
function drawHeartShape(x,y,size,fill,stroke="#7b111b"){
  ctx.save();
  ctx.translate(x,y);
  ctx.scale(size/32,size/32);
  ctx.beginPath();
  ctx.moveTo(16,29);
  ctx.bezierCurveTo(12,24,2,18,2,10);
  ctx.bezierCurveTo(2,3,11,0,16,7);
  ctx.bezierCurveTo(21,0,30,3,30,10);
  ctx.bezierCurveTo(30,18,20,24,16,29);
  ctx.closePath();
  ctx.fillStyle=fill;ctx.fill();
  ctx.strokeStyle=stroke;ctx.lineWidth=3;ctx.stroke();
  ctx.restore();
}
function drawHeartPickups(){
  for(const h of heartPickups){
    const pulse=1+.08*Math.sin(performance.now()/130+h.phase);
    ctx.save();
    ctx.shadowBlur=12;ctx.shadowColor="#ffccd1";
    drawHeartShape(h.x,h.y,31*pulse,"#ef3f55");
    ctx.restore();
  }
}
function drawLives(){
  const size=42;
  const gap=16;
  const totalW=maxLives*size+(maxLives-1)*gap;
  const startX=(W-totalW)/2;
  const y=H-GROUND_H+20;

  for(let i=0;i<maxLives;i++){
    if(i<lives)drawHeartShape(startX+i*(size+gap),y,size,"#ef3f55");
    else drawHeartShape(startX+i*(size+gap),y,size,"#ffffff33","#8a8a8a");
  }

  if(heartMessage&&performance.now()<heartMessageUntil){
    const alpha=Math.min(1,(heartMessageUntil-performance.now())/250);
    ctx.save();ctx.globalAlpha=alpha;
    ctx.textAlign="center";ctx.textBaseline="middle";
    ctx.font='900 24px "Courier New",monospace';
    ctx.lineWidth=5;ctx.strokeStyle="#222";
    ctx.strokeText(heartMessage,W/2,H-GROUND_H+10);
    ctx.fillStyle=heartMessage.includes("+")?"#ff6676":"#fff";
    ctx.fillText(heartMessage,W/2,H-GROUND_H+10);
    ctx.restore();
  }
}
function drawGround(){
  const y=H-GROUND_H;pxRect(0,y,W,GROUND_H,"#ded895");pxRect(0,y,W,14,"#6aba43");pxRect(0,y+14,W,8,"#8bd45a");
  for(let x=-48;x<W+48;x+=48){const xx=x-groundOffset;pxRect(xx,y+26,28,8,"#c5bd72");pxRect(xx+22,y+42,28,8,"#eee8ac");pxRect(xx+8,y+63,22,7,"#c5bd72")}
  pxRect(0,y,W,4,"#202020");
}
function bodyColor(){
  const colors={
    amarillo:"#f3d53c",
    azul:"#4a9df3",
    verde:"#52c95a",
    turquesa:"#32c7c5",
    celeste:"#86d8ff",
    rojo:"#e94e4e",
    naranja:"#f08a2f",
    rosa:"#ef78b8",
    coral:"#ef6f61",
    morado:"#9a5de8",
    negro:"#2a2a2a",
    blanco:"#f8f8f2",
    dorado:"#e4b62c",
    metalico:"#b9c2cc",
    obsidiana:"#171821"
  };
  return colors[equipped.color]||colors.amarillo;
}
function drawTrail(x,y){
  if(state!=="playing")return;
  const now=performance.now();

  if(equipped.estela==="estela"){
    for(let i=0;i<5;i++){
      const xx=x-14-i*10,yy=y+bird.h/2+Math.sin(now/90+i)*4;
      pxRect(xx,yy,5,5,["#ff5b5b","#ffd84d","#63d969","#4da6ff","#b56cff"][i]);
    }
  }else if(equipped.estela==="estela_estelar"){
    for(let i=0;i<7;i++){
      const xx=x-12-i*11,yy=y+bird.h/2+Math.sin(now/75+i*.7)*7;
      ctx.fillStyle=i%2===0?"#fff3a0":rainbowColor(i*45);
      ctx.font='900 10px Arial';ctx.fillText(i%2===0?"★":"✦",xx,yy);
    }
  }

  if(equipped.efecto==="legendario"){
    for(let i=0;i<6;i++){
      const xx=x-18-i*12,yy=y+bird.h/2+Math.sin(now/65+i)*8;
      pxRect(xx,yy,6,6,rainbowColor(i*55));
    }
  }
}
function drawBird(){
  const x=Math.round(bird.x),y=Math.round(bird.y),tilt=state==="playing"?Math.max(-.35,Math.min(.65,bird.vy/12)):0;
  const now=performance.now(),powered=jackpotActive,grace=!powered&&(now<jackpotGraceUntil||now<lifeGraceUntil);
  const premium=equipped.efecto==="aura"||equipped.efecto==="holografico"||equipped.efecto==="legendario";
  const scale=powered?1.22:1;

  drawTrail(x,y);

  ctx.save();ctx.translate(x+bird.w/2,y+bird.h/2);ctx.rotate(tilt);ctx.scale(scale,scale);ctx.translate(-bird.w/2,-bird.h/2);
  if(powered||grace||premium){
    ctx.shadowBlur=powered?22:premium?16:13;
    ctx.shadowColor=powered||premium?rainbowColor(180):"#fff2a0";
  }

  const body=powered?rainbowColor(0):bodyColor();
  const hi=powered?rainbowColor(80):"#f6e55a";
  const low=powered?rainbowColor(210):"#d8a926";

  pxRect(5,5,24,20,"#222");pxRect(8,2,16,4,"#222");pxRect(8,25,18,4,"#222");
  pxRect(7,7,20,16,body);pxRect(10,4,12,4,hi);pxRect(8,20,16,5,low);

  // Wings
  pxRect(0,12,11,11,"#222");
  if(equipped.alas==="alas_fuego"){
    pxRect(-5,10,16,13,"#222");pxRect(-3,12,12,9,rainbowColor(20));pxRect(-7,15,6,5,"#ff6a2a");
  }else{
    pxRect(2,14,9,7,equipped.alas==="alas"?"#ffd84d":powered?rainbowColor(130):"#f0bf2f");
  }

  // Eye / glasses
  pxRect(23,7,10,10,"#fff");pxRect(29,10,4,4,"#111");
  if(equipped.gafas==="gafas"){
    pxRect(21,6,8,6,"#111");pxRect(30,6,8,6,"#111");pxRect(28,8,4,2,"#111");
  }else if(equipped.gafas==="visera"){
    pxRect(20,5,19,7,"#111");pxRect(22,7,15,3,rainbowColor(200));
  }

  // Beak
  pxRect(31,15,10,7,"#222");pxRect(33,16,8,5,powered?rainbowColor(300):"#f27d2f");

  // Hats
  if(equipped.sombrero==="gorra"){
    pxRect(8,-3,19,5,"#2155d9");pxRect(20,1,11,3,"#2155d9");
  }else if(equipped.sombrero==="corona"){
    pxRect(8,-4,20,5,"#ffd84d");
    pxRect(9,-9,4,5,"#ffd84d");pxRect(16,-11,4,7,"#ffd84d");pxRect(23,-9,4,5,"#ffd84d");
  }else if(equipped.sombrero==="helice"){
    pxRect(8,-3,19,5,"#e94e4e");pxRect(16,-8,4,5,"#222");
    const spin=Math.floor((now/80)%2);
    if(spin===0)pxRect(9,-10,18,3,"#4a9df3");else pxRect(16,-15,3,13,"#4a9df3");
  }

  // Special accessory
  if(equipped.accesorio==="estrella"){
    ctx.fillStyle="#ffd84d";ctx.font='900 16px Arial';ctx.fillText("★",4,8);
  }else if(equipped.accesorio==="rayo"){
    ctx.fillStyle="#ffe14d";ctx.font='900 17px Arial';ctx.fillText("ϟ",2,8);
  }else if(equipped.accesorio==="halo"){
    ctx.strokeStyle="#fff3a1";ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(18,-8,12,4,0,0,Math.PI*2);ctx.stroke();
  }

  if(powered){
    const sx=7+((now/9)%20);pxRect(sx,7,4,15,"#fff");
  }
  if(equipped.efecto==="holografico"){
    ctx.globalAlpha=.38;pxRect(7,7,20,16,rainbowColor(120));ctx.globalAlpha=1;
  }
  if(equipped.efecto==="legendario"){
    ctx.globalAlpha=.32;pxRect(5,5,24,20,rainbowColor(40));ctx.globalAlpha=1;
    for(let i=0;i<4;i++){
      const a=now/420+i*Math.PI/2;
      pxRect(18+Math.cos(a)*22,14+Math.sin(a)*18,3,3,"#fff7a6");
    }
  }
  ctx.restore();

  if((powered||grace)&&now-jackpotImpactFlash<120){
    ctx.save();ctx.strokeStyle="#fff8a8";ctx.lineWidth=4;
    const cx=x+bird.w/2,cy=y+bird.h/2;
    for(let i=0;i<6;i++){
      const a=i*Math.PI/3,len=24;ctx.beginPath();
      ctx.moveTo(cx+Math.cos(a)*17,cy+Math.sin(a)*17);
      ctx.lineTo(cx+Math.cos(a)*len,cy+Math.sin(a)*len);ctx.stroke();
    }
    ctx.restore();
  }
}
function drawScore(){
  ctx.textAlign="center";ctx.font='bold 42px "Courier New",monospace';ctx.lineWidth=7;ctx.strokeStyle="#222";
  ctx.strokeText(String(score),W/2,62);ctx.fillStyle="#fff";ctx.fillText(String(score),W/2,62);
  ctx.textAlign="left";ctx.font='bold 18px "Courier New",monospace';ctx.lineWidth=4;ctx.strokeStyle="#222";
  ctx.strokeText(`MEJOR: ${best}`,18,30);ctx.fillStyle="#fff";ctx.fillText(`MEJOR: ${best}`,18,30);

  if(state==="playing"||state==="quiz"){
    const pct=Math.round(235/targetMusicMs()*100);
    ctx.font='bold 13px "Courier New",monospace';ctx.lineWidth=3;ctx.strokeStyle="#222";
    ctx.strokeText(`RITMO ${pct}%`,18,52);ctx.fillStyle="#fff";ctx.fillText(`RITMO ${pct}%`,18,52);
  }
}
function panel(title,lines,footer){
  const boxW=570,boxH=220,x=(W-boxW)/2,y=150;
  pxRect(x+8,y+8,boxW,boxH,"#0005");pxRect(x,y,boxW,boxH,"#fff7d6");
  ctx.strokeStyle="#222";ctx.lineWidth=6;ctx.strokeRect(x,y,boxW,boxH);
  ctx.textAlign="center";ctx.fillStyle="#246b22";ctx.font='bold 38px "Courier New",monospace';ctx.fillText(title,W/2,y+52);
  ctx.fillStyle="#222";ctx.font='bold 20px "Courier New",monospace';
  let yy=y+95;for(const line of lines){ctx.fillText(line,W/2,yy);yy+=31}
  ctx.fillStyle="#555";ctx.font='bold 16px "Courier New",monospace';ctx.fillText(footer,W/2,y+boxH-20);
}
function draw(){
  drawSky();for(const p of pipes)drawPipe(p);drawCoins();drawHeartPickups();drawGround();drawBird();drawScore();drawLives();drawJackpotCountdown();
  if(state==="ready")panel("FLAPPY VERB",["PRETÉRITO","Vuela. Pasa. Elige."],"ESPACIO / CLIC para empezar");
  if(state==="gameover")panel("FIN DEL JUEGO",[`PUNTUACIÓN: ${score}`,`MEJOR: ${best}`],"Elige JUGAR o PERSONALIZAR AVE");
}

function loop(now){
  const dt=now-lastTime;lastTime=now;update(dt,now);draw();requestAnimationFrame(loop);
}

// ------------------------------------------------------------
// INPUT
// ------------------------------------------------------------
document.addEventListener("keydown",e=>{
  if(menuOverlay.style.display==="flex"||customizeOverlay.style.display==="flex")return;
  if(state==="quiz"){
    if(["1","2","3"].includes(e.key)){e.preventDefault();submitChoice(Number(e.key)-1)}
    return;
  }
  if(e.code==="Space"){
    e.preventDefault();
    if(state==="gameover"){returnToMenuFromGameOver()}else flap();
  }else if(e.key==="Enter"&&state==="gameover"){returnToMenuFromGameOver()}
});
canvas.addEventListener("pointerdown",()=>{
  if(menuOverlay.style.display==="flex"||customizeOverlay.style.display==="flex")return;
  if(state==="quiz")return;
  if(state==="gameover"){returnToMenuFromGameOver()}else flap();
});
overlay.addEventListener("pointerdown",e=>e.stopPropagation());


document.getElementById("playBtn").addEventListener("click",()=>{
  hideMainMenu();resetGame();flap();
});
document.getElementById("customizeBtn").addEventListener("click",()=>{
  buildCustomizer();menuOverlay.style.display="none";customizeOverlay.style.display="flex";
});
document.getElementById("backBtn").addEventListener("click",()=>{
  customizeOverlay.style.display="none";showMainMenu();
});

// Save again whenever the tab/app is backgrounded or closed.
window.addEventListener("pagehide",saveBundle);
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden")saveBundle()});

bootstrapUnlocks();
resetGame();
showMainMenu();

// Downloaded file:// copies do not have reliable shared localStorage across filenames/paths.
if(location.protocol==="file:"){
  console.warn("Flappy Verb: progreso local no confiable en archivos descargados. Usa la URL HTTPS publicada para guardado estable.");
}
if(!storageOkay){
  console.warn("Flappy Verb: este navegador o política escolar no permite localStorage persistente.");
}

requestAnimationFrame(loop);
})();
</script>
